<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="buy.title">Buy a gift voucher - Balaton Park Circuit</title>
<meta name="description" content="Buy a Balaton Park Circuit gift voucher. The recipient picks their own track day.">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="Gift a day on track at Balaton Park Circuit">
<meta property="og:description" content="Track session vouchers for the 2027 season.">
<meta property="og:image" content="https://gifts.balatonpark.com/og-share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
  :root { --ink:#0A1422; --blue:#427AB7; --pale:#A8CEF0; --text:#F5F7FB;
          --cond:'Barlow Condensed',sans-serif; }
  *{box-sizing:border-box}
  /* An inline display: beats the hidden attribute otherwise. */
  [hidden]{display:none!important}
  body { margin:0;touch-action:manipulation; background:var(--ink); color:var(--text);
         font-family:Inter,-apple-system,system-ui,sans-serif;
         -webkit-font-smoothing:antialiased; overflow-x:hidden }
  a{color:var(--pale)} a:hover{color:var(--text)}
  h1,h2,h3{font-family:var(--cond);font-weight:800;text-transform:uppercase;margin:0}
  input,select,textarea,button{font-family:inherit}

  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.16)}}
  @keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .up{animation:fadeUp .95s cubic-bezier(.22,.61,.36,1) both}
  .fi{animation:fadeIn 1.3s ease both}
  .d1{animation-delay:.12s} .d2{animation-delay:.24s}
  .kb{animation:kenburns 28s ease-out both alternate infinite}
  .rule{transform-origin:left;animation:rule .8s cubic-bezier(.22,.61,.36,1) both}
  .lift{transition:transform .35s cubic-bezier(.22,.61,.36,1),background .25s,border-color .25s,box-shadow .35s}
  .lift:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.42)}
  .zw{overflow:hidden} .zw img{transition:transform .9s cubic-bezier(.22,.61,.36,1);display:block}
  .zw:hover img{transform:scale(1.06)}
  @media (prefers-reduced-motion: reduce){
    .up,.fi,.kb,.rule{animation:none!important;opacity:1!important;transform:none!important}
    .lift,.zw img{transition:none!important}
  }

  .pad{padding-left:clamp(20px,5vw,56px);padding-right:clamp(20px,5vw,56px)}
  .wrap{width:100%;max-width:1240px;margin:0 auto}

  .hero{position:relative;min-height:clamp(230px,34vw,300px);display:flex;
        flex-direction:column;justify-content:space-between;overflow:hidden}
  .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,20,34,.70) 0%,rgba(10,20,34,.40) 40%,rgba(10,20,34,.97) 100%)}
  h1{font-size:clamp(36px,7vw,62px);line-height:.96}
  .eyebrow{display:flex;align-items:center;gap:14px;margin:0 0 16px;font-size:12px;
    font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(245,247,251,.85)}
  .eyebrow i{display:inline-block;width:40px;height:2px;background:var(--blue)}
  /* The Hungarian step line is far longer than the English one. On a phone it
     wrapped to two lines and ran up under the language buttons, so it gets
     tighter tracking and the header row gets a gap that cannot be absorbed. */
  @media (max-width:760px){
    .headrow{margin-bottom:26px}
    .eyebrow{font-size:11px;letter-spacing:.12em;gap:10px}
    .eyebrow i{width:24px}
  }

  .cols{display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,52px);align-items:flex-start}
  .main{flex:999 1 560px;min-width:0}
  h2.sec{display:flex;align-items:center;gap:14px;margin:48px 0 22px;font-size:12px;
    font-weight:600;letter-spacing:.22em;color:rgba(245,247,251,.72)}
  h2.sec i{display:inline-block;width:28px;height:2px;background:var(--blue)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  /* Each receiver is a block of its own: packages, who it is for, delivery. */
  .gift{position:relative;padding-top:4px}
  .gift + .gift{margin-top:46px;padding-top:40px;border-top:1px solid rgba(255,255,255,.12)}
  .gifthead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 6px}
  .gifthead .who{font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--pale)}
  .drop{min-height:38px;padding:0 14px;cursor:pointer;background:none;
    color:rgba(245,247,251,.58);border:1px solid rgba(255,255,255,.22);
    font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  .drop:hover{color:var(--text);border-color:rgba(255,255,255,.5)}
  .addgift{display:inline-flex;align-items:center;gap:10px;margin-top:34px;min-height:56px;
    padding:0 26px;cursor:pointer;background:none;color:var(--pale);
    border:1px dashed rgba(168,206,240,.55);
    font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.08em;text-transform:uppercase;
    transition:background .25s,border-color .25s,color .25s}
  .addgift:hover{background:rgba(66,122,183,.14);border-color:var(--blue);color:var(--text)}
  .sumgift{margin:18px 0 6px;font-family:var(--cond);font-weight:800;font-size:15px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--pale)}
  .card{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:172px;
    padding:22px;cursor:pointer;text-align:left;color:var(--text);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10)}

  /* The "i" sits inside a button, so it is a span rather than a nested
     button, and it swallows the click so it never toggles the package. */
  .info{position:absolute;top:10px;right:10px;z-index:2;
    display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(255,255,255,.34);background:rgba(10,20,34,.45);
    font-family:var(--cond);font-weight:800;font-size:15px;line-height:1;
    color:rgba(245,247,251,.78);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .info:hover,.info:focus-visible{background:var(--blue);border-color:var(--blue);color:#fff;outline:none}
  #tip{position:fixed;z-index:60;max-width:290px;padding:16px 18px;
    background:#16293F;border:1px solid var(--blue);
    font-size:13px;font-weight:300;line-height:1.6;color:var(--text);
    box-shadow:0 18px 44px rgba(0,0,0,.5)}
  #tip b{display:block;margin-bottom:6px;font-family:var(--cond);font-weight:800;
    font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--pale)}
  .card[aria-pressed=true]{background:#16293F;border:2px solid var(--blue)}
  .card .big{font-family:var(--cond);font-weight:800;font-size:clamp(40px,7vw,50px);line-height:.86;text-transform:uppercase}
  .card .kind{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(245,247,251,.60)}
  .card .prices{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-top:20px}
  .card .now{font-family:var(--cond);font-weight:800;font-size:28px;color:var(--pale)}
  .card .was{font-family:var(--cond);font-weight:700;font-size:20px;
    color:rgba(245,247,251,.45);text-decoration:line-through}
  .card .off{margin-top:7px;font-size:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--pale)}

  .hotel{position:relative;display:flex;width:100%;margin-top:14px;padding:0;
    overflow:hidden;cursor:pointer;color:var(--text);background:#0D1A2B;
    border:1px solid rgba(255,255,255,.10);text-align:left}
  .hotel[aria-pressed=true]{border:2px solid var(--blue)}
  .hotel .shot{position:absolute;inset:0;overflow:hidden}
  .hotel .shot img{width:100%;height:100%;object-fit:cover}
  .hotel .veil{position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(10,20,34,.95) 0%,rgba(10,20,34,.84) 42%,rgba(10,20,34,.38) 100%)}
  .hotel .body{position:relative;display:flex;flex-direction:column;gap:12px;width:100%;
    min-height:clamp(260px,34vw,320px);padding:clamp(22px,4vw,38px);justify-content:center}

  label.f{display:block;font-size:13px;font-weight:500;color:rgba(245,247,251,.72);margin-bottom:8px}
  /* 16px is not a taste choice: iOS Safari zooms the whole page in when a
     field smaller than that takes focus, and the page can then be panned
     sideways. Keeping every field at 16px is what stops that. */
  .fld{width:100%;height:50px;padding:0 14px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.16);color:var(--text);font-size:16px;
    transition:border-color .25s,background .25s}
  textarea.fld{height:auto;padding:13px 14px;resize:vertical}
  .fld:focus{outline:none;border-color:var(--blue);background:rgba(66,122,183,.10)}
  .fld[aria-invalid=true]{border-color:#D9604F}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}

  .delrow{display:flex;align-items:flex-start;gap:13px;padding:17px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10)}
  .delrow.on{background:rgba(66,122,183,.14);border:1px solid var(--blue)}
  .delrow input{margin-top:2px;accent-color:var(--blue)}
  .delrow .t{display:block;font-size:15px;font-weight:500}
  .delrow .s{display:block;margin-top:3px;font-size:13px;font-weight:300;color:rgba(245,247,251,.60)}
  #schedule{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;padding:22px 24px;
    background:rgba(66,122,183,.12);border:1px solid rgba(66,122,183,.45)}
  #schedule[hidden]{display:none}
  /* Both halves share the row evenly: a wide date beside a narrow time left
     a dead gap on the right, which read as a broken field on a phone. */
  #schedule .half{flex:1 1 150px;min-width:0}
  /* Safari draws date and time inputs its own way - centred value, native
     chrome, its own height. Strip that so they match every other field. */
  input[type=date],input[type=time]{
    -webkit-appearance:none;appearance:none;text-align:left;
    min-height:50px;line-height:normal;background:var(--ink)}
  input[type=date]::-webkit-date-and-time-value,
  input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.55);cursor:pointer}

  /* Wide enough for Stripe to lay the payment methods out side by side
     rather than folding the extras into a dropdown. */
  aside{flex:1 1 420px;position:sticky;top:24px;margin-top:38px;padding:30px;
    background:rgba(10,20,34,.96);border:1px solid rgba(255,255,255,.14)}
  @media (max-width:900px){ aside{position:static;margin-top:8px;padding:22px 18px} }
  .line{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.10)}
  .line .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .step{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.20);
    color:var(--text);font-size:17px;line-height:1;cursor:pointer}
  .nudge{display:flex;align-items:center;gap:9px;width:100%;margin:11px 0 0;
    min-height:44px;padding:9px 13px;background:rgba(66,122,183,.16);
    border:1px dashed var(--blue);color:var(--pale);font-size:13px;font-weight:500;
    text-align:left;cursor:pointer}
  .pay{width:100%;min-height:58px;background:var(--blue);color:#fff;border:none;
    font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.04em;
    text-transform:uppercase;cursor:pointer}
  .pay:disabled{opacity:.5;cursor:default}
  .err{margin:0 0 16px;padding:11px 13px;background:rgba(217,96,79,.13);
    border:1px solid rgba(217,96,79,.3);color:#F0A99D;font-size:13px;line-height:1.5}
  .err[hidden]{display:none}

  .langpick{display:flex;gap:6px;flex:0 0 auto}
  .langpick button{min-height:44px;min-width:52px;padding:0 14px;cursor:pointer;
    background:rgba(10,20,34,.55);color:rgba(245,247,251,.72);
    border:1px solid rgba(255,255,255,.28);border-radius:0;
    font-family:var(--cond);font-weight:800;font-size:17px;letter-spacing:.08em;
    transition:background .2s,color .2s,border-color .2s}
  .langpick button:hover{color:var(--text);border-color:rgba(255,255,255,.55)}
  .langpick button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
</style>
<script src="i18n.js?v=20261111h"></script>
</head>
<body>

<div style="min-height:100%;display:flex;flex-direction:column">

  <section class="hero">
    <img class="bg kb" src="purchase-hero.jpg" alt="A car on track at Balaton Park Circuit">
    <div class="veil"></div>
    <div class="fi wrap pad headrow" style="position:relative;padding-top:30px">
      <a href="index.html" style="display:inline-flex"><img src="bpc-logo.svg" alt="Balaton Park Circuit" style="height:clamp(24px,4vw,30px);width:auto"></a>
      <div id="langpick"></div>
    </div>
    <div class="wrap pad" style="position:relative;padding-bottom:40px">
      <p class="eyebrow up"><i class="rule"></i><span data-i18n="buy.eyebrow">Step 1 of 2 · Choose &amp; pay</span></p>
      <h1 class="up d1"><span data-i18n="buy.h1a">Gift a session.</span> <span style="color:var(--pale)" data-i18n="buy.h1b">Or more.</span></h1>
    </div>
  </section>

  <main class="wrap pad" style="flex-grow:1;padding-top:44px;padding-bottom:84px">
    <p class="up" data-i18n="buy.lede" style="margin:0 0 48px;font-size:17px;font-weight:300;color:rgba(245,247,251,.72)">Pick one package or several - they add up in the summary. The recipient picks their own track day later.</p>

    <form id="buy" class="cols" novalidate>

      <div class="main">
        <p class="up" id="smallprint" style="margin:0 0 34px;font-size:13px;font-weight:300;line-height:1.75;color:rgba(245,247,251,.62)"></p>

        <div id="gifts"></div>

        <h2 class="sec up"><i></i><span data-i18n="buy.sec4">4 · Your details</span></h2>
        <div class="grid2">
          <div>
            <label class="f" for="bname" data-i18n="buy.bname">Your name</label>
            <input id="bname" class="fld" type="text" autocomplete="name">
          </div>
          <div>
            <label class="f" for="bemail" data-i18n="buy.bemail">Your email</label>
            <input id="bemail" class="fld" type="email" required autocomplete="email">
          </div>
        </div>

        <button type="button" id="addGift" class="addgift">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span data-i18n="buy.addReceiver">Add another receiver</span>
        </button>
      </div>

      <aside class="up d2">
        <h2 style="margin:0 0 22px;font-size:30px;line-height:1" data-i18n="buy.summary">Summary</h2>
        <p class="err" id="err" hidden></p>
        <div id="lines"></div>
        <div id="saving" hidden style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 0 0">
          <span style="font-size:14px;font-weight:500;color:var(--pale)" data-i18n="buy.save">You save</span>
          <span style="font-size:16px;font-weight:600;color:var(--pale)" id="savingAmt"></span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:22px 0 26px">
          <span style="font-family:var(--cond);font-weight:800;font-size:24px;text-transform:uppercase" data-i18n="buy.total">Total</span>
          <span style="font-family:var(--cond);font-weight:800;font-size:40px;line-height:1;color:var(--pale)" id="total">€0</span>
        </div>
        <div id="payment" style="margin-bottom:20px"></div>
        <button type="submit" class="pay lift" id="pay" data-i18n="buy.pay">Pay with card</button>

        <p style="margin:16px 0 0;font-size:12px;font-weight:300;line-height:1.7;color:rgba(245,247,251,.60)">
          <span data-i18n="buy.noCard">We never see your card details.</span><br><span id="codeNote"></span><br>
          <span id="refundLine"></span></p>
        <div style="margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.10)">
          <p id="haveLine" style="margin:0;font-size:13px;font-weight:300;line-height:1.6;color:rgba(245,247,251,.72)"></p>
          <p id="changeLine" style="margin:12px 0 0;font-size:12px;font-weight:300;line-height:1.65;color:rgba(245,247,251,.55)"></p>
          <p style="margin:12px 0 0;font-size:12px;font-weight:300">
            <a href="faq.html" data-i18n="buy.faqLink">Questions? Read the FAQ</a></p>
        </div>
      </aside>

    </form>
  </main>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://hbosxvmprhzrheilwwfv.supabase.co/functions/v1';

  var $ = function (s) { return document.querySelector(s); };
  var el = function (t, c, h) { var n = document.createElement(t);
    if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
  var esc = function (s) { return String(s == null ? '' : s)
    .replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); };
  var money = function (cents) { return i18n.money(cents); };
  var t = function (k, v) { return i18n.t(k, v); };
  var link = function (href, label, blank) {
    return '<a href="' + href + '"' + (blank ? ' target="_blank" rel="noopener"' : '') +
           '>' + label + '</a>';
  };

  // Shape of each package card's headline number.
  var FACE = {
    s1:  { big: '1',    kind: 'buy.kindSession' },
    s3:  { big: '3',    kind: 'buy.kindSessions' },
    s6:  { big: '6',    kind: 'buy.kindSessions' },
    vip: { big: 'VIP',  kind: 'buy.kindDay' }
  };

  var cat = null;            // catalogue from the server

  // One entry per receiver. Each carries its own packages, its own recipient
  // fields and its own delivery setting; the buyer's details are asked once
  // and apply to the lot. The discount tier is still counted across every
  // block together, which is the point of buying for several people at once.
  var gifts = [];
  var seq = 0;

  function newGift() {
    return { id: ++seq, qty: {}, delivery: 'now', cardFor: {}, el: null };
  }

  // The ladder counts sessions in the basket, not vouchers. The 3- and
  // 6-session prices already carry their own discount; this is the deeper
  // tier you can only reach by combining. Shown here, enforced server-side.
  function sessionsInBasket() {
    return gifts.reduce(function (sum, g) {
      return sum + cat.packages.reduce(function (n, p) {
        return n + (p.splittable ? (p.session_count || 0) * (g.qty[p.code] || 0) : 0);
      }, 0);
    }, 0);
  }
  function countIn(g) {
    return cat.packages.reduce(function (n, p) { return n + (g.qty[p.code] || 0); }, 0);
  }
  // The tier states the price of a session outright. percent is only the
  // figure on the badge, so 58 a session can be shown as 10% without the
  // arithmetic and the rounding having to agree.
  function tierFor(sessions) {
    var hit = null;
    (cat.tiers || []).forEach(function (t) { if (sessions >= t.min_sessions) hit = t; });
    return hit;
  }
  function nextTier(sessions) {
    var up = (cat.tiers || []).filter(function (t) { return t.min_sessions > sessions; })
      .sort(function (a, b) { return a.min_sessions - b.min_sessions; });
    return up.length ? up[0] : null;
  }
  // Package names live in the database in English, so the basket showed
  // "1 session" and "VIP Day" on the Hungarian site. The catalogue's name is
  // the fallback for anything added to the database later.
  function pkgName(p) {
    var k = 'pkg.' + p.code + '.name';
    var s = t(k);
    return s === k ? p.name : s;
  }

  // What one voucher of this package costs right now.
  function unitFor(p, sessions) {
    var tier = p.splittable ? tierFor(sessions) : null;
    if (!tier || !tier.unit_cents) return p.price_cents;
    return tier.unit_cents * (p.session_count || 1);
  }
  // What the badge says, which is the tier's stated figure rather than one
  // worked back out of the price.
  function pctFor(p, sessions, list, now) {
    var tier = p.splittable ? tierFor(sessions) : null;
    if (tier && tier.unit_cents) return tier.percent;
    return list > now ? Math.round((1 - now / list) * 100) : 0;
  }

  // ------------------------------------------------------------ render

  // ------------------------------------------------------------ render

  // A receiver block: its packages, who it is for, how it is delivered.
  // Built once per block and then patched, because rebuilding restarts the
  // entrance animation on every card, which reads as a flash.
  function buildGiftBlock(g) {
    var wrap = el('div', 'gift');
    g.el = wrap;

    var head = el('div', 'gifthead');
    head.innerHTML = '<span class="who"></span>';
    var drop = el('button', 'drop', t('buy.removeReceiver'));
    drop.type = 'button';
    drop.addEventListener('click', function () { removeGift(g); });
    head.append(drop);
    wrap.append(head);

    var h1 = el('h2', 'sec', '<i class="rule"></i><span data-i18n="buy.secPackages">' +
      esc(t('buy.secPackages')) + '</span>');

  // The heading only earns its place once there is more than one receiver.
  function paintHeads() {
    gifts.forEach(function (g, i) {
      var head = g.el.querySelector('.gifthead');
      var name = (g.el.querySelector('.r-name').value || '').trim();
      head.hidden = gifts.length < 2;
      head.querySelector('.who').textContent = gifts.length < 2 ? '' :
        (name ? t('buy.receiverNamed', { n: i + 1, name: name }) : t('buy.receiverN', { n: i + 1 }));
    });
  }

  function renderDelivery(g) {
    var defs = [
      { id: 'now',   label: t('buy.delNow'),   sub: t('buy.delNowSub') },
      { id: 'date',  label: t('buy.delDate'),  sub: t('buy.delDateSub') },
      { id: 'print', label: t('buy.delPrint'), sub: t('buy.delPrintSub') }
    ];
    var host = g.el.querySelector('.delivery');
    host.replaceChildren.apply(host, defs.map(function (o) {
      var lab = el('label', 'delrow lift' + (g.delivery === o.id ? ' on' : ''),
        '<input type="radio" name="delivery-' + g.id + '"' + (g.delivery === o.id ? ' checked' : '') + '>' +
        '<span><span class="t">' + esc(o.label) + '</span><span class="s">' + esc(o.sub) + '</span></span>');
      lab.querySelector('input').addEventListener('change', function () {
        g.delivery = o.id;
        renderDelivery(g);
        g.el.querySelector('.schedule').hidden = g.delivery !== 'date';
        paintSendNote(g);
      });
      return lab;
    }));
  }

  function paintCards() {
    var sessions = sessionsInBasket();
    gifts.forEach(function (g) {
      cat.packages.forEach(function (p) {
        var card = g.cardFor[p.code];
        if (!card) return;
        var n = g.qty[p.code] || 0;
        var list = p.list_price_cents || p.price_cents;
        // A card shows what it costs to add, so an unselected one is priced
        // at the tier its own sessions would reach.
        var reach = sessions + (n || !p.splittable ? 0 : (p.session_count || 0));
        var now = unitFor(p, reach);
        var pct = pctFor(p, reach, list, now);

        card.setAttribute('aria-pressed', n > 0 ? 'true' : 'false');
        card.querySelector('.now').textContent = money(now);
        var w = card.querySelector('.was');
        w.hidden = !pct;
        w.textContent = money(list);
        var off = card.querySelector('.off');
        off.hidden = !pct;
        off.textContent = pct ? t('buy.off', { pct: pct }) : '';
      });
    });
  }

  function renderSummary() {
    var host = $('#lines');
    host.replaceChildren();

    var sessions = sessionsInBasket();
    var gross = 0, total = 0;
    var rows = [];

    gifts.forEach(function (g, gi) {
      cat.packages.forEach(function (p) {
        var n = g.qty[p.code] || 0;
        if (!n) return;
        var list = p.list_price_cents || p.price_cents;
        var unit = unitFor(p, sessions);
        gross += list * n; total += unit * n;
        rows.push({ g: g, gi: gi, p: p, n: n, list: list, unit: unit,
                    was: list * n, line: unit * n });
      });
    });

    if (!rows.length) {
      host.append(el('p', null, t('buy.empty')));
      host.firstChild.style.cssText = 'margin:0 0 22px;padding:20px 0;font-size:14px;' +
        'font-weight:300;line-height:1.7;color:rgba(245,247,251,.60);' +
        'border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10)';
    }

    // Every unit is a whole number of euros, so this should never fire. It
    // stays as a floor in case a package is ever priced in cents.
    if (total % 100) {
      var trim = total % 100;
      var big = rows.reduce(function (a, b) { return b.line > a.line ? b : a; }, rows[0]);
      big.line -= trim;
      big.unit = Math.round(big.line / big.n);
      total -= trim;
    }

    var lastGift = -1;
    rows.forEach(function (r) {
      if (gifts.length > 1 && r.gi !== lastGift) {
        lastGift = r.gi;
        var name = (r.g.el.querySelector('.r-name').value || '').trim();
        var head = el('p', 'sumgift', esc(name
          ? t('buy.receiverNamed', { n: r.gi + 1, name: name })
          : t('buy.receiverN', { n: r.gi + 1 })));
        host.append(head);
      }

      var p = r.p, n = r.n, list = r.list, unit = r.unit;
      var pct = pctFor(p, sessions, list, unit);
      var row = el('div', 'line');
      row.innerHTML =
        '<div class="top">' +
          '<span style="display:flex;flex-direction:column;gap:9px;min-width:0">' +
            '<span style="font-size:15px;font-weight:500">' + esc(pkgName(p)) + '</span>' +
            '<span style="display:flex;align-items:center;gap:8px">' +
              '<button type="button" class="step" data-act="dec" aria-label="' + esc(t('buy.removeOne', { name: pkgName(p) })) + '">-</button>' +
              '<span style="min-width:22px;text-align:center;font-size:14px;font-weight:600">' + n + '</span>' +
              '<button type="button" class="step" data-act="inc" aria-label="' + esc(t('buy.addOne', { name: pkgName(p) })) + '">+</button>' +
              '<span style="font-size:12px;color:rgba(245,247,251,.50)">' +
                t('buy.each', { amount: money(unit) }) + '</span>' +
            '</span>' +
          '</span>' +
          '<span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap">' +
            '<span style="font-family:var(--cond);font-weight:800;font-size:22px;line-height:1">' + money(r.line) + '</span>' +
            (pct ? '<span style="font-size:12px;color:rgba(245,247,251,.45);text-decoration:line-through">' + money(r.was) + '</span>' : '') +
          '</span>' +
        '</div>' +
        (pct ? '<p style="margin:11px 0 0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pale)">' +
               t('buy.off', { pct: pct }) + '</p>' : '');

      row.querySelector('[data-act=dec]').addEventListener('click', function () { bump(r.g, p.code, -1); });
      row.querySelector('[data-act=inc]').addEventListener('click', function () { bump(r.g, p.code, 1); });
      host.append(row);
    });

    // One nudge for the whole basket: the tier is about total sessions, so a
    // per-line prompt would be telling the buyer to do something that does
    // not apply to that line.
    var next = sessions > 0 ? nextTier(sessions) : null;
    if (next) {
      var add = next.min_sessions - sessions;
      var nudge = el('button', 'nudge',
        '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>' +
        '<span>' + t('buy.nudge', {
          n: add,
          sessions: t(add === 1 ? 'common.sessionOne' : 'common.sessionMany'),
          pct: next.percent
        }) + '</span>');
      nudge.type = 'button';
      nudge.style.marginTop = '16px';
      // Added to the first block, since that is the one the buyer started.
      nudge.addEventListener('click', function () { bump(gifts[0], 's1', add); });
      host.append(nudge);
    }

    // Written defensively: a summary field that is not on the page should
    // not be able to stop the basket from drawing.
    var set = function (sel, text) { var n = $(sel); if (n) n.textContent = text; };
    if ($('#saving')) $('#saving').hidden = gross <= total;
    set('#savingAmt', '-' + money(gross - total));
    set('#total', money(total));
    syncPaymentForm(total);
  }

  function draw() {
    paintHeads();
    paintCards();
    renderSummary();
  }

  function addGift(focus) {
    var g = newGift();
    gifts.push(g);
    $('#gifts').append(buildGiftBlock(g));
    i18n.apply(g.el);
    draw();
    if (focus) {
      g.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var f = g.el.querySelector('.r-name');
      if (f) setTimeout(function () { f.focus(); }, 300);
    }
    return g;
  }

  function removeGift(g) {
    if (gifts.length < 2) return;        // the first block is the order itself
    gifts = gifts.filter(function (x) { return x !== g; });
    g.el.remove();
    draw();
  }

  function toggle(g, code) {
    g.qty[code] = (g.qty[code] || 0) > 0 ? 0 : 1;
    draw();
  }
  function bump(g, code, by) {
    g.qty[code] = Math.max(0, Math.min(20, (g.qty[code] || 0) + by));
    draw();
  }

  // ------------------------------------------------------------ submit

  function fail(msg, field) {
    var box = $('#err');
    box.textContent = msg;
    box.hidden = false;
    if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function validEmail(v) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v).trim()); }

  $('#buy').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('#err').hidden = true;
    $('#bemail').removeAttribute('aria-invalid');
    gifts.forEach(function (g) {
      ['.r-email', '.s-date'].forEach(function (sel) {
        var f = g.el.querySelector(sel);
        if (f) f.removeAttribute('aria-invalid');
      });
    });

    // Every block is checked before anything is sent, so the buyer fixes all
    // of it in one go rather than discovering the next fault after each try.
    var payload = [];
    for (var i = 0; i < gifts.length; i++) {
      var g = gifts[i];
      var who = gifts.length > 1 ? ' (' + t('buy.receiverN', { n: i + 1 }) + ')' : '';

      var items = Object.keys(g.qty)
        .filter(function (c) { return g.qty[c] > 0; })
        .map(function (c) { return { package_code: c, qty: g.qty[c] }; });
      if (!items.length) {
        g.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return fail(t('buy.errPackage') + who);
      }

      var remail = g.el.querySelector('.r-email');
      if (!validEmail(remail.value)) return fail(t('buy.errRecipient') + who, remail);

      var deliverAt = null;
      if (g.delivery === 'date') {
        // Named clock, not t: a variable called t here is hoisted over the
        // whole handler and leaves the translator undefined from line one.
        var dateF = g.el.querySelector('.s-date');
        var d = dateF.value, clock = g.el.querySelector('.s-time').value || '08:00';
        if (!d) return fail(t('buy.errDate') + who, dateF);
        // The field is Budapest time, so the instant has to be built with
        // Budapest's offset before it is compared with now. Parsed without
        // one the browser reads it in its own zone, and from Tel Aviv a
        // perfectly valid Budapest time came back as "in the past".
        var stamp = d + 'T' + clock + ':00' + budapestOffset(new Date(d + 'T12:00:00Z'));
        var when = new Date(stamp);
        if (isNaN(when.getTime()) || when.getTime() < Date.now()) {
          return fail(t('buy.errPast') + who, dateF);
        }
        deliverAt = stamp;
      }

      payload.push({
        items: items,
        recipient_name: g.el.querySelector('.r-name').value,
        recipient_email: remail.value,
        gift_message: g.el.querySelector('.r-msg').value,
        delivery_method: g.delivery === 'date' ? 'scheduled' : g.delivery,
        deliver_at: deliverAt
      });
    }

    if (!validEmail($('#bemail').value)) {
      return fail(t('buy.errBuyer'), $('#bemail'));
    }

    var btn = $('#pay');
    btn.disabled = true;

    // Everything below runs inside a promise, so a thrown error always lands
    // in the catch at the end. Thrown outside one it would leave the button
    // disabled with no message - a Pay press that hangs for good.
    Promise.resolve().then(function () {
      btn.textContent = t('buy.paying');
      // Validate the card fields before creating anything server-side, so a
      // mistyped card never leaves a stray order behind.
      if (!pay.elements) return;
      return pay.elements.submit().then(function (r) {
        if (r.error) throw new Error(r.error.message || t('buy.errCard'));
      });
    }).then(function () {
    return fetch(API + '/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gifts: payload,
        buyer_name: $('#bname').value.trim(),
        buyer_email: $('#bemail').value.trim()
      })
    }).then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, body: body }; });
    }).then(function (r) {
      if (!r.ok) {
        throw new Error(t(r.body && r.body.error === 'payments_not_configured'
          ? 'buy.errNoPay' : 'buy.errStart'));
      }
      // The card form on this page takes it from here. Without a publishable
      // key the server hands back a hosted URL instead, and we send them
      // there rather than failing.
      if (r.body.client_secret && pay.stripe && pay.elements) {
        return pay.stripe.confirmPayment({
          elements: pay.elements,
          clientSecret: r.body.client_secret,
          confirmParams: { return_url: r.body.return_url }
        }).then(function (c) {
          // Reached only when the payment did NOT go through; a success
          // leaves the page for the return URL.
          throw new Error(c.error && (c.error.type === 'card_error' || c.error.type === 'validation_error')
            ? c.error.message : t('buy.errCard'));
        });
      }
      if (r.body.checkout_url) {
        window.location.href = r.body.checkout_url;
        return;
      }
      throw new Error(t('buy.errStart'));
    });
    }).catch(function (e) {
      fail(e instanceof TypeError ? t('buy.errNet') : (e && e.message) || t('buy.errStart'));
      btn.disabled = false;
      btn.textContent = t('buy.pay');
    });
  });

  // ------------------------------------------------------ embedded payment

  var stripeJs = null;
  function loadStripeJs() {
    if (stripeJs) return stripeJs;
    stripeJs = new Promise(function (resolve, reject) {
      if (window.Stripe) return resolve(window.Stripe);
      var s = document.createElement('script');
      s.src = 'https://js.stripe.com/v3/';
      s.onload = function () { window.Stripe ? resolve(window.Stripe) : reject(new Error('stripe')); };
      s.onerror = function () { reject(new Error('stripe')); };
      document.head.appendChild(s);
    });
    return stripeJs;
  }

  // Stripe draws the card fields inside its own frame - we can't reach into
  // them, but we can hand it the page's own palette so the seam doesn't show.
  var APPEARANCE = {
    theme: 'night',
    variables: {
      colorPrimary: '#427AB7',
      colorBackground: '#0A1422',
      colorText: '#F5F7FB',
      colorTextSecondary: 'rgba(245,247,251,0.60)',
      colorTextPlaceholder: 'rgba(245,247,251,0.34)',
      colorDanger: '#D9604F',
      fontFamily: 'Inter, -apple-system, system-ui, sans-serif',
      fontSizeBase: '15px',
      borderRadius: '7px',
      spacingUnit: '4px'
    },
    rules: {
      '.Input': {
        backgroundColor: 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.16)',
        boxShadow: 'none',
        padding: '13px 14px'
      },
      '.Input:focus': { border: '1px solid #427AB7', boxShadow: 'none',
                        backgroundColor: 'rgba(66,122,183,0.10)' },
      '.Input--invalid': { border: '1px solid #D9604F', boxShadow: 'none' },
      '.Label': { color: 'rgba(245,247,251,0.72)', fontSize: '13px', fontWeight: '500' },
      '.Tab': { backgroundColor: 'rgba(255,255,255,0.04)',
                border: '1px solid rgba(255,255,255,0.16)', boxShadow: 'none' },
      '.Tab:hover': { backgroundColor: 'rgba(255,255,255,0.07)' },
      '.Tab--selected': { backgroundColor: 'rgba(66,122,183,0.16)',
                          border: '1px solid #427AB7', boxShadow: 'none' },
      '.TabLabel': { color: 'rgba(245,247,251,0.82)' },
      '.Error': { color: '#F0A99D', fontSize: '13px' }
    }
  };

  var pay = { stripe: null, elements: null, element: null, ready: false };

  // The card form is drawn before any order exists: Stripe is told the
  // amount up front and the payment intent is only created when Pay is
  // pressed. That keeps the form visible from the first paint, and stops the
  // database filling with pending orders from people who never pay.
  function syncPaymentForm(totalCents) {
    if (!cat || !cat.stripe_publishable_key) return;
    if (totalCents < 50) return;                    // Stripe's floor

    if (pay.elements) {
      pay.elements.update({ amount: totalCents });
      return;
    }
    if (pay.ready) return;                           // already being set up
    pay.ready = true;

    loadStripeJs().then(function (Stripe) {
      pay.stripe = Stripe(cat.stripe_publishable_key);
      pay.elements = pay.stripe.elements({
        mode: 'payment',
        amount: totalCents,
        currency: (cat.currency || 'eur').toLowerCase(),
        // Without this Stripe labels its own fields from the browser's
        // language, so a Hungarian browser read "Kártyaszám" on the English
        // site. It follows the switcher instead.
        locale: i18n.lang,
        appearance: APPEARANCE
      });
      pay.element = pay.elements.create('payment', { layout: 'tabs' });
      pay.element.mount('#payment');
    }).catch(function () {
      pay.ready = false;
      // Without the card form the page still works: the server falls back to
      // Stripe's hosted page and the Pay button sends them there.
    });
  }

  // Hungary is UTC+1, UTC+2 between the last Sundays of March and October.
  // Says what the chosen Budapest time is on the buyer's own clock, so
  // nobody has to work out the difference themselves.
  function paintSendNote(g) {
    if (!g || !g.el) return;
    var n = g.el.querySelector('.s-note');
    if (!n) return;
    var d = g.el.querySelector('.s-date').value;
    var clock = g.el.querySelector('.s-time').value;
    n.textContent = t('buy.sendNote');
    if (!d || !clock) return;
    var when = new Date(d + 'T' + clock + ':00' + budapestOffset(new Date(d + 'T12:00:00Z')));
    if (isNaN(when.getTime())) return;
    var here = when.toLocaleTimeString(i18n.lang === 'hu' ? 'hu-HU' : 'en-GB',
      { hour: '2-digit', minute: '2-digit' });
    var mine = when.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    // Only worth saying when the buyer is not already on Budapest time.
    if (here === clock && when.toISOString().slice(0, 10) === d) return;
    n.textContent = t('buy.sendNote') + ' ' + t('buy.sendLocal', { time: here, date: mine });
  }

  function budapestOffset(when) {
    var y = when.getFullYear();
    var lastSunday = function (month) {   // month: 0-based
      var d = new Date(Date.UTC(y, month + 1, 0));
      d.setUTCDate(d.getUTCDate() - d.getUTCDay());
      return d;
    };
    var start = lastSunday(2), end = lastSunday(9);
    return (when >= start && when < end) ? '+02:00' : '+01:00';
  }

  // Lines with links inside them are built from the dictionary.
  function paintProse() {
    var terms = link('https://www.balatonparkcircuit.com/tc', t('common.terms'), true);
    var put = function (sel, html) { var n = $(sel); if (n) n.innerHTML = html; };
    put('#smallprint', t('buy.smallprint'));

                  t('common.emailUs'))
    }));
    put('#haveLine', t('buy.haveVoucher', {
      link: '<a href="redeem.html" style="font-weight:500">' + t('buy.redeemHere') + '</a>'
    }));
    put('#changeLine', t('buy.mayChange', { terms: terms }));
  }

  // ---------------------------------------------------------- package info
  // One shared panel rather than one per card: the cards are narrow and a
  // panel inside them would have nowhere to go.
  var tip = null;
  function closeTip() {
    if (tip) { tip.remove(); tip = null; }
    document.removeEventListener('keydown', onTipKey);
  }
  function onTipKey(ev) { if (ev.key === 'Escape') closeTip(); }
  function openTip(icon) {
    closeTip();
    var code = icon.getAttribute('data-tip');
    tip = el('div');
    tip.id = 'tip';
    tip.setAttribute('role', 'dialog');
    tip.innerHTML = '<b>' + esc(t('pkg.' + code + '.title')) + '</b>' + esc(t('pkg.' + code + '.body'));
    document.body.appendChild(tip);

    var r = icon.getBoundingClientRect(), box = tip.getBoundingClientRect();
    var left = Math.min(Math.max(12, r.left + r.width / 2 - box.width / 2),
                        window.innerWidth - box.width - 12);
    var top = r.bottom + 10;
    if (top + box.height > window.innerHeight - 12) top = Math.max(12, r.top - box.height - 10);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    document.addEventListener('keydown', onTipKey);
  }
  document.addEventListener('click', function (ev) {
    var icon = ev.target.closest && ev.target.closest('.info');
    if (icon) { ev.preventDefault(); ev.stopPropagation(); openTip(icon); return; }
    if (tip && !ev.target.closest('#tip')) closeTip();
  });
  document.addEventListener('keydown', function (ev) {
    var icon = ev.target.closest && ev.target.closest('.info');
    if (icon && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openTip(icon); }
  });
  window.addEventListener('resize', closeTip);
  window.addEventListener('scroll', closeTip, true);

  i18n.apply();
  i18n.mountSwitch(document.getElementById('langpick'));
  paintProse();
  // Stripe fixes its locale when the element is created, so switching
  // language has to build a new one; draw() mounts it again straight after.
  function resetPaymentForm() {
    if (pay.element) {
      try { pay.element.unmount(); } catch (e) {}
      try { pay.element.destroy(); } catch (e) {}
    }
    pay.stripe = null; pay.elements = null; pay.element = null; pay.ready = false;
  }

  i18n.onChange(function () {
    closeTip();
    paintProse();
    gifts.forEach(function (g) {
      renderDelivery(g);
      paintSendNote(g);
    });
    resetPaymentForm();
    if (cat) draw();
  });

  $('#addGift').addEventListener('click', function () { addGift(true); });

  fetch(API + '/catalogue')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      cat = data;
      var g = addGift(false);
      // Open on the middle package, the way the mockup did.
      if (cat.packages.some(function (p) { return p.code === 's3'; })) g.qty.s3 = 1;
      draw();
    })
    .catch(function (e) {
      // Worth saying out loud: this catch also swallows a fault in the code
      // that builds the page, not just a failed request.
      console.error('catalogue/boot failed', e && (e.stack || e.message || e));
      $('#gifts').innerHTML =
        '<p style="color:rgba(245,247,251,.6);font-size:14px">' +
        t('buy.errLoad', { email: link('mailto:info@balatonparkcircuit.com', t('common.emailUs')) }) + '</p>';
      $('#pay').disabled = true;
      $('#addGift').hidden = true;
    });
})();
</script>
</body>
</html>
