name: Deploy site to GitHub Pages

# The built-in "pages build and deployment" run reported "No jobs were run",
# which is what happens when Pages is set to deploy from GitHub Actions and the
# repository has no workflow to do it. This is that workflow: it publishes the
# repository as-is, no build step, because the site is plain HTML.
#
# If Pages is instead set to "Deploy from a branch", this workflow is harmless
# but redundant — it will fail at the deploy step saying Pages is not
# configured for Actions, which is itself the answer.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
