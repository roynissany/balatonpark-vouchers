<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift vouchers strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@300;400&display=swap">
<style>
  /* Nothing here may scroll. A Wix HTML embed is an iframe of a height Wix
     decides, and an inner scrollbar on a phone is miserable, so the layout
     only ever shrinks to fit: no fixed heights, no min-widths, wrapping
     allowed everywhere, and overflow hidden as a last resort. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  .strip{position:relative;display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;height:100%;min-height:0;
    padding:clamp(18px,3vw,38px) clamp(20px,4vw,56px);
    background:#000;color:#F5F7FB;text-decoration:none;overflow:hidden}

  /* The photograph sits behind everything, darkened, and fades to solid
     black at the bottom so the strip melts into a dark Wix page instead of
     ending on a hard edge. */
  .strip img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 42%;filter:brightness(.52) saturate(.92)}
  .strip .veil{position:absolute;inset:0;background:
    linear-gradient(90deg, rgba(5,9,15,.92) 0%, rgba(5,9,15,.62) 46%, rgba(5,9,15,.30) 100%),
    linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,.78) 82%, #000 100%)}

  /* The content is held to a readable column and centred, rather than being
     stretched across the full width of whatever Wix gives us. */
  .inner{position:relative;display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:clamp(18px,3vw,44px);width:100%;max-width:1180px}

  .words{min-width:0;flex:1 1 340px}
  .kick{display:flex;align-items:center;gap:13px;margin-bottom:10px;
    font-size:clamp(12px,1.25vw,15px);font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:#A8CEF0}
  .kick i{display:block;width:clamp(26px,3vw,44px);height:2px;background:#427AB7;flex:0 0 auto}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;
     font-size:clamp(32px,5.2vw,62px);line-height:.98;letter-spacing:-.01em;
     text-shadow:0 2px 18px rgba(0,0,0,.6)}
  h1 span{color:#A8CEF0}
  p{margin-top:clamp(8px,1vw,14px);font-size:clamp(14px,1.45vw,19px);font-weight:300;
    line-height:1.5;color:rgba(245,247,251,.86);max-width:46ch;
    text-shadow:0 1px 10px rgba(0,0,0,.55)}

  .go{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;
    justify-content:center;gap:11px;text-decoration:none;
    padding:clamp(15px,1.9vw,23px) clamp(26px,3vw,46px);
    background:#427AB7;color:#fff;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;
    font-size:clamp(18px,2.1vw,27px);letter-spacing:.05em;text-transform:uppercase;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transition:background .3s,transform .3s}
  .go:hover{background:rgba(66,122,183,.5);transform:translateY(-2px)}
  .go svg{flex:0 0 auto}

  /* Below this the button sits under the words rather than beside them, and
     the paragraph goes, because a strip is not the place to make someone
     read on a phone. */
  /* Wix decides the height, not us, so the content has to give way rather
     than spill: the paragraph goes first, then the eyebrow, then the
     headline comes down a size. Nothing is ever allowed to be cut off. */
  @media (max-height:235px){ p{display:none} }
  @media (max-height:165px){
    .kick{display:none}
    h1{font-size:clamp(24px,4vw,42px)}
    .go{padding:12px 24px;font-size:clamp(16px,1.9vw,22px)}
  }
  @media (max-height:110px){
    h1{font-size:clamp(19px,3.2vw,30px)}
    .strip{padding:10px clamp(16px,3vw,40px)}
  }

  @media (max-width:620px){
    /* nowrap matters: wrap in a column container wraps into a second
       COLUMN, which put the button beside the words and off the edge. */
    .inner{flex-direction:column;flex-wrap:nowrap;align-items:stretch;
           justify-content:center;gap:14px}
    /* flex-basis follows the main axis, so the 340px that was a minimum
       WIDTH in a row becomes a 340px HEIGHT in a column and shoves the
       button off the bottom. */
    .words{flex:0 0 auto}
    p{display:none}
    .go{width:100%}
    .strip img.bg{object-position:50% 38%}
  }
  @media (prefers-reduced-motion:reduce){ .go{transition:none} }
</style>
</head>
<body>
  <a class="strip" href="https://gifts.balatonpark.com" target="_blank" rel="noopener">
    <img class="bg" src="https://gifts.balatonpark.com/hero.jpg" alt="" aria-hidden="true">
    <span class="veil"></span>
    <span class="inner">
      <span class="words">
        <span class="kick"><i></i>Gift vouchers</span>
        <h1>Gift a session. <span>Or more.</span></h1>
        <p>Track time at Balaton Park Circuit, wrapped. They pick their own track day.</p>
      </span>
      <span class="go">
        Buy a voucher
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h13M12 5l7 7-7 7"></path>
        </svg>
      </span>
    </span>
  </a>
</body>
</html>
