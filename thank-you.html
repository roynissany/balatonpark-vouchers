<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="ty.title">Thank you - Balaton Park Circuit</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root{--ink:#0A1422;--blue:#427AB7;--pale:#A8CEF0;--text:#F5F7FB;
        --cond:'Barlow Condensed',sans-serif}
  *{box-sizing:border-box}
  /* An inline display: beats the hidden attribute otherwise. */
  [hidden]{display:none!important}
  body{margin:0;touch-action:manipulation;background:var(--ink);color:var(--text);
    font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
  a{color:var(--pale)} a:hover{color:var(--text)}
  h1,h2{font-family:var(--cond);font-weight:800;text-transform:uppercase;margin:0}
  .pad{padding-left:clamp(20px,5vw,56px);padding-right:clamp(20px,5vw,56px)}
  .wrap{width:100%;max-width:920px;margin:0 auto}

  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.17)}}
  @keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(66,122,183,0)}50%{box-shadow:0 0 0 6px rgba(66,122,183,.14)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .up{animation:fadeUp .95s cubic-bezier(.22,.61,.36,1) both}
  .fi{animation:fadeIn 1.3s ease both}
  .d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
  .kb{animation:kenburns 28s ease-out both alternate infinite}
  .rule{transform-origin:left;animation:rule .8s cubic-bezier(.22,.61,.36,1) both}
  .glow{animation:glow 3s ease-in-out infinite}
  .lift{transition:transform .35s cubic-bezier(.22,.61,.36,1),background .25s,border-color .25s,box-shadow .35s}
  .lift:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.42)}
  @media (prefers-reduced-motion:reduce){
    .up,.fi,.kb,.rule,.glow{animation:none!important;opacity:1!important;transform:none!important}
    .lift{transition:none!important}
  }

  .hero{position:relative;min-height:clamp(250px,36vw,340px);display:flex;
    flex-direction:column;justify-content:space-between;overflow:hidden}
  .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,20,34,.66) 0%,rgba(10,20,34,.36) 36%,rgba(10,20,34,.97) 100%)}
  h1{font-size:clamp(36px,7vw,62px);line-height:.96}
  .eyebrow{display:flex;align-items:center;gap:14px;margin:0 0 18px;font-size:12px;
    font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(245,247,251,.9)}
  .eyebrow i{display:inline-block;width:40px;height:2px;background:var(--blue)}

  .tk{width:100%;max-width:640px;margin:0 auto;display:block}
  .tkwrap{margin:0 0 18px}
  .giftblk + .giftblk{margin-top:46px;padding-top:40px;border-top:1px solid rgba(255,255,255,.12)}
  .giftwho{margin:0 0 14px;font-family:var(--cond);font-weight:800;font-size:17px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--pale)}
  .giftnote{margin:0 0 20px;font-size:15px;font-weight:300;line-height:1.7;color:rgba(245,247,251,.82)}
  /* The buttons belong to the ticket above them, so the gap below has to be
     bigger than the gap above or the next ticket reads as part of this one. */
  .acts{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 44px}
  .giftblk > .acts:last-child{margin-bottom:0}

  /* The print sheet is its own document: the page's dark theme and every
     control are taken out of the flow, and what is left is laid out for an
     A4 page in ink on white. */
  .printroot{display:none}
  @page{size:A4 portrait;margin:0}
  @media print{
    html,body{background:#fff!important}
    body > *{display:none!important}
    body > .printroot{display:block!important}
    .sheet{position:relative;width:210mm;min-height:297mm;padding:13mm;
      background:#fff;color:#1a1d24;box-sizing:border-box;
      font-family:Inter,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sheetin{position:relative;height:100%;border:1.6pt solid #B8902C;padding:13mm 12mm;
      box-sizing:border-box}
    .sheetin::before{content:'';position:absolute;inset:3.2mm;border:0.5pt solid #D9BE70}
    .orn{position:absolute;width:17mm;height:17mm;border:0 solid #B8902C}
    .orn.tl{top:9mm;left:9mm;border-top-width:3pt;border-left-width:3pt}
    .orn.tr{top:9mm;right:9mm;border-top-width:3pt;border-right-width:3pt}
    .orn.bl{bottom:9mm;left:9mm;border-bottom-width:3pt;border-left-width:3pt}
    .orn.br{bottom:9mm;right:9mm;border-bottom-width:3pt;border-right-width:3pt}

    .kick{margin:0 0 3mm;text-align:center;font-family:'Barlow Condensed',Arial,sans-serif;
      font-weight:700;font-size:10pt;letter-spacing:4pt;text-transform:uppercase;color:#9A7A22}
    .forwho{margin:0 0 7mm;text-align:center;font-family:'Barlow Condensed',Arial,sans-serif;
      font-weight:800;font-size:27pt;line-height:1.05;text-transform:uppercase;color:#12161d}
    .tkbox{margin:0 0 7mm}
    .tkbox .ticket{display:block;width:100%;height:auto}
    .msg{margin:0 0 4mm;padding:0 10mm;text-align:center;font-family:Georgia,serif;
      font-style:italic;font-size:13pt;line-height:1.6;color:#2b3039}
    .from{margin:0 0 7mm;text-align:center;font-family:'Barlow Condensed',Arial,sans-serif;
      font-weight:700;font-size:11pt;letter-spacing:2.5pt;text-transform:uppercase;color:#6b5a2a}
    .rule2{height:0.5pt;background:#D9BE70;margin:0 0 6mm}
    .cols2{display:flex;gap:9mm;margin:0 0 6mm}
    .cols2 > div{flex:1}
    .sheetin h2{margin:0 0 2mm;font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;
      font-size:11pt;letter-spacing:2pt;text-transform:uppercase;color:#9A7A22}
    .sheetin p{margin:0;font-size:9.5pt;line-height:1.6;color:#3a414c}
    .steps ol{margin:0;padding-left:5mm;font-size:9.5pt;line-height:1.75;color:#3a414c}
    .foot{margin:6mm 0 0;text-align:center;font-size:8.5pt;color:#7b828d}
  }
  .panel{padding:clamp(24px,4vw,36px);background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.10)}
  .codebox{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
  .code{flex:1 1 300px;display:flex;align-items:center;padding:20px clamp(16px,3vw,26px);
    background:var(--ink);border:1px dashed var(--blue);font-family:var(--cond);
    font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:.14em;line-height:1;
    color:var(--pale);word-break:break-all}
  .copy{min-height:62px;padding:0 28px;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid rgba(255,255,255,.22);font-family:Inter,sans-serif;font-size:15px;
    font-weight:500;cursor:pointer}
  dl.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;
    margin:30px 0 0;padding-top:26px;border-top:1px solid rgba(255,255,255,.10)}
  dl.meta dt{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(245,247,251,.60)}
  dl.meta dd{margin:8px 0 0;font-size:15px;font-weight:300}
  .cta{display:inline-flex;align-items:center;justify-content:center;min-height:62px;
    padding:0 clamp(24px,5vw,40px);text-decoration:none;font-family:var(--cond);
    font-weight:800;font-size:clamp(18px,3.4vw,22px);letter-spacing:.04em;text-transform:uppercase}
  .cta.primary{background:var(--blue);color:#fff}
  .cta.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.5)}
  .spinner{width:26px;height:26px;border:2px solid rgba(168,206,240,.28);
    border-top-color:var(--pale);border-radius:50%;animation:spin .9s linear infinite}
  .notice{padding:22px 26px;background:rgba(66,122,183,.12);border:1px solid rgba(66,122,183,.45);
    font-size:15px;font-weight:300;line-height:1.7;color:rgba(245,247,251,.88)}
  footer{border-top:1px solid rgba(255,255,255,.10);margin-top:auto}
  footer .inner{display:flex;flex-wrap:wrap;gap:20px;align-items:center;
    justify-content:space-between;padding-top:26px;padding-bottom:26px;
    font-size:13px;color:rgba(245,247,251,.55)}
  footer a{text-decoration:none;color:rgba(245,247,251,.55)}
  footer a:hover{color:var(--text)}

  .langpick{display:flex;gap:6px;flex:0 0 auto}
  .langpick button{min-height:44px;min-width:52px;padding:0 14px;cursor:pointer;
    background:rgba(10,20,34,.55);color:rgba(245,247,251,.72);
    border:1px solid rgba(255,255,255,.28);border-radius:0;
    font-family:var(--cond);font-weight:800;font-size:17px;letter-spacing:.08em;
    transition:background .2s,color .2s,border-color .2s}
  .langpick button:hover{color:var(--text);border-color:rgba(255,255,255,.55)}
  .langpick button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
</style>
<script src="i18n.js?v=20261111f"></script>
<script src="ticket.js?v=20261111f"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>

<section class="hero">
  <img class="bg kb" src="garage.jpg" alt="">
  <div class="veil"></div>
  <div class="fi wrap pad headrow" style="position:relative;padding-top:30px">
    <a href="index.html" style="display:inline-flex"><img src="bpc-logo.svg" alt="Balaton Park Circuit" style="height:clamp(26px,4vw,30px);width:auto"></a>
    <div id="langpick"></div>
  </div>
  <div class="wrap pad" style="position:relative;padding-bottom:clamp(32px,5vw,42px)">
    <p class="eyebrow up"><i class="rule"></i><span id="eyebrow">Payment received</span></p>
    <h1 class="up d1" id="headline">Thank you.</h1>
  </div>
</section>

<main class="wrap pad" style="padding-top:clamp(32px,5vw,46px);padding-bottom:clamp(48px,8vw,84px)">
  <div id="body"></div>
</main>

<footer>
  <div class="inner wrap pad">
    <a href="https://balatonpark.com" target="_blank" rel="noopener" style="display:inline-flex">
      <img src="bpc-logo.svg" alt="Balaton Park Circuit" style="height:22px;width:auto;opacity:.75"></a>
    <span style="display:flex;flex-wrap:wrap;gap:24px">
      <a href="https://balatonpark.com" target="_blank" rel="noopener" data-i18n="foot.site">BalatonPark.com</a>
      <a href="faq.html" data-i18n="foot.faq">FAQ</a>
      <a href="https://www.balatonparkcircuit.com/tc" target="_blank" rel="noopener" data-i18n="foot.terms">Terms</a>
      <a href="mailto:info@balatonparkcircuit.com" data-i18n="foot.contact">Contact us</a>
    </span>
  </div>
</footer>

<script>
(function () {
  'use strict';
  var API = 'https://hbosxvmprhzrheilwwfv.supabase.co/functions/v1';
  var orderId = new URLSearchParams(location.search).get('order') || '';
  var body = document.getElementById('body');

  i18n.apply();
  i18n.mountSwitch(document.getElementById('langpick'));
  // Redraw whatever is on screen when the language changes, rather than
  // leaving half the page in the old one.
  i18n.onChange(function () {
    if (!last) return;
    if (last.kind === 'fail') fail(last.text);
    else if (last.kind === 'order') show(last.d);
  });

  var esc = function (s) { return String(s == null ? '' : s)
    .replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); };
  var money = function (c) { return i18n.money(c); };
  var day = function (s) { return i18n.formatDate(s); };
  var t = function (k, v) { return i18n.t(k, v); };
  var contactLink = function () {
    return '<a href="mailto:info@balatonparkcircuit.com?subject=Gift%20Voucher%20Order">' +
           t('foot.contact') + '</a>';
  };
  var last = null;   // what was last rendered, so a language change can redraw it

  if (!orderId) return fail(t('ty.noOrder'));

  waiting(t('ty.confirming'));
  poll(0);

  // Stripe returns the buyer the instant the card clears, which is usually
  // before the webhook has finished minting the voucher. Wait it out rather
  // than telling someone who has just paid that nothing happened.
  function poll(attempt) {
    fetch(API + '/order-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (r) {
      if (!r.ok) {
        if (r.d.error === 'not_found' && attempt < 12) return retry(attempt);
        throw new Error('lookup');
      }
      if (r.d.status === 'paid' || r.d.status === 'refunded') return show(r.d);
      if (attempt < 12) return retry(attempt);
      waiting(t('ty.slow'), true);
    }).catch(function () {
      if (attempt < 12) return retry(attempt);
      fail(t('ty.unreachable'));
    });
  }
  function retry(attempt) { setTimeout(function () { poll(attempt + 1); }, 1500); }

  function waiting(text, done) {
    body.innerHTML =
      '<div class="panel up" style="display:flex;align-items:center;gap:18px">' +
        (done ? '' : '<div class="spinner"></div>') +
        '<p style="margin:0;font-size:16px;font-weight:300;line-height:1.7;color:rgba(245,247,251,.85)">' +
          esc(text) + '</p></div>';
  }

  function fail(text) {
    last = { kind: 'fail', text: text };
    document.getElementById('eyebrow').textContent = t('ty.problemEyebrow');
    document.getElementById('headline').textContent = t('ty.problemH');
    body.innerHTML = '<div class="notice up">' + esc(text) + ' ' +
      t('ty.contactFix', { contact: contactLink() }) + '</div>';
  }

  // Printing produces a gift sheet, not a bare ticket: a frame, who it is
  // from, the message that came with the order, and a few lines saying what
  // this is for someone who has never heard of the place.
  function printTicket(code) {
    var hit = null;
    giftPairs().forEach(function (pair) {
      if (pair.v.code === code) hit = pair;
    });
    if (!hit) return;

    var d = last && last.d ? last.d : {};
    var from = (d.buyer_name || '').trim();
    var to = (hit.g.recipient_name || '').trim();
    var msg = (hit.g.gift_message || '').trim();

    var root = document.querySelector('.printroot');
    if (!root) {
      root = document.createElement('div');
      root.className = 'printroot';
      document.body.appendChild(root);
    }

    root.innerHTML =
      '<div class="sheet">' +
        '<div class="orn tl"></div><div class="orn tr"></div>' +
        '<div class="orn bl"></div><div class="orn br"></div>' +
        '<div class="sheetin">' +
          '<p class="kick">' + esc(t('pr.kicker')) + '</p>' +
          (to ? '<h1 class="forwho">' + esc(t('pr.for', { name: to })) + '</h1>'
              : '<h1 class="forwho">' + esc(t('pr.forAnon')) + '</h1>') +
          '<div class="tkbox">' + ticketFor(hit.v) + '</div>' +
          (msg ? '<blockquote class="msg">' + esc(msg) + '</blockquote>' : '') +
          (from ? '<p class="from">' + esc(t('pr.from', { name: from })) + '</p>' : '') +
          '<div class="rule2"></div>' +
          '<div class="cols2">' +
            '<div><h2>' + esc(t('pr.whatH')) + '</h2><p>' + esc(t('pr.whatP')) + '</p></div>' +
            '<div><h2>' + esc(t('pr.whereH')) + '</h2><p>' + esc(t('pr.whereP')) + '</p></div>' +
          '</div>' +
          '<div class="steps">' +
            '<h2>' + esc(t('pr.howH')) + '</h2>' +
            '<ol><li>' + esc(t('pr.how1')) + '</li>' +
                '<li>' + esc(t('pr.how2')) + '</li>' +
                '<li>' + esc(t('pr.how3')) + '</li></ol>' +
          '</div>' +
          '<p class="foot">' + esc(t('pr.foot')) + '</p>' +
        '</div>' +
      '</div>';

    var done = function () {
      root.innerHTML = '';
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    window.print();
  }

  // Each voucher together with the gift it belongs to.
  function giftPairs() {
    var d = last && last.d ? last.d : {};
    var gs = (d.gifts && d.gifts.length) ? d.gifts : [{
      recipient_name: d.recipient_name, recipient_email: d.recipient_email,
      gift_message: d.gift_message, vouchers: d.vouchers || []
    }];
    return gs.reduce(function (acc, g) {
      return acc.concat((g.vouchers || []).map(function (v) { return { g: g, v: v }; }));
    }, []);
  }

  // The QR carries the redeem link with the code already in it, so scanning
  // the printed ticket lands on the right page with nothing to type.
  function qrFor(code) {
    if (typeof qrcode !== 'function') return null;
    try {
      var q = qrcode(0, 'M');
      q.addData('https://gifts.balatonpark.com/redeem.html?code=' + code);
      q.make();
      var n = q.getModuleCount(), out = [];
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          if (q.isDark(r, c)) {
            out.push('<rect x="' + c + '" y="' + r + '" width="1.06" height="1.06" rx="0.2"/>');
          }
        }
      }
      return { rects: out.join(''), modules: n };
    } catch (e) {
      return null;                 // a ticket without its QR still works
    }
  }

  function ticketFor(v) {
    var n = v.sessions_total || 1;
    var qr = qrFor(v.code);
    return bpcTicket({
      code: v.code,
      shortCode: String(v.code).replace(/^BPC-/, ''),
      sessions: v.package_code === 'vip' ? 'VIP' : n,
      headline: t('tk.headline' + (n > 1 ? 'Many' : 'One'), { n: n }),
      sub: t('tk.sub'),
      eyebrow: t('tk.eyebrow'),
      codeLabel: t('tk.codeLabel'),
      footnote: t('tk.footnote'),
      admit: t('tk.admit'),
      unit: t(n > 1 ? 'common.sessionMany' : 'common.sessionOne').toUpperCase(),
      each: t('tk.each'),
      scanLabel: t('tk.scan'),
      alt: v.package + ' ' + v.code,
      qr: qr && qr.rects,
      qrModules: qr && qr.modules
    });
  }

  // What happens next, in the words that match what this receiver chose.
  function noteFor(g) {
    var who = esc(g.recipient_name || g.recipient_email || '');
    if (g.delivery_method === 'print') return t('ty.nextPrint2', { name: who });
    if (g.delivery_method === 'scheduled' && g.deliver_at) {
      return t('ty.nextSched2', { email: esc(g.recipient_email), date: esc(day(g.deliver_at)) });
    }
    if (g.emailed) return t('ty.nextSent2', { recipient: esc(g.recipient_email) });
    return t('ty.nextPending2', { recipient: esc(g.recipient_email) });
  }

  function show(d) {
    last = { kind: 'order', d: d };
    document.getElementById('eyebrow').textContent = t('ty.eyebrow');

    if (d.status === 'refunded') {
      document.getElementById('eyebrow').textContent = t('ty.refundedEyebrow');
      document.getElementById('headline').textContent = t('ty.refundedH');
      body.innerHTML = '<div class="notice up">' +
        t('ty.refundedBody', { contact: contactLink() }) + '</div>';
      return;
    }

    var gifts = (d.gifts && d.gifts.length) ? d.gifts : [{
      recipient_name: d.recipient_name, recipient_email: d.recipient_email,
      delivery_method: d.delivery_method, deliver_at: d.deliver_at,
      emailed: d.emailed, vouchers: d.vouchers || []
    }];
    var all = gifts.reduce(function (n, g) { return n + g.vouchers.length; }, 0);
    var many = gifts.length > 1;
    document.getElementById('headline').textContent = all > 1 ? t('ty.h1many') : t('ty.h1one');

    var blocks = gifts.map(function (g, gi) {
      var head = many
        ? '<p class="giftwho">' + esc(g.recipient_name
            ? t('buy.receiverNamed', { n: gi + 1, name: g.recipient_name })
            : t('buy.receiverN', { n: gi + 1 })) + '</p>'
        : '';
      var tickets = g.vouchers.map(function (v) {
        return '<div class="tkwrap">' + ticketFor(v) + '</div>' +
          '<div class="acts">' +
            '<button type="button" class="cta primary lift print" data-code="' + esc(v.code) + '">' +
              t('ty.print') + '</button>' +
            '<button type="button" class="cta ghost lift copy" data-code="' + esc(v.code) + '">' +
              t('common.copy') + '</button>' +
            '<a class="cta ghost lift" href="redeem.html?code=' + encodeURIComponent(v.code) + '">' +
              t('ty.redeemNow') + '</a>' +
          '</div>';
      }).join('');
      return '<div class="giftblk up d' + Math.min(gi + 1, 3) + '">' + head +
             '<p class="giftnote">' + noteFor(g) + '</p>' + tickets + '</div>';
    }).join('');

    body.innerHTML =
      blocks +
      '<div class="up d3" style="display:flex;flex-wrap:wrap;gap:14px;margin:40px 0 0">' +
        '<a class="cta ghost lift" href="index.html">' + t('ty.buyAnother') + '</a>' +
      '</div>' +
      '<p class="up d3" style="margin:26px 0 0;font-size:13px;font-weight:300;line-height:1.7;' +
        'color:rgba(245,247,251,.62)">' +
        t('ty.paidOn', { amount: money(d.total_cents), date: esc(day(d.paid_at)),
                         codes: all > 1 ? t('ty.codeMany') : t('ty.codeOne'),
                         contact: contactLink() }) + '</p>';
  }

  // Bound once on the container rather than per button, so it keeps working
  // across every redraw: a language switch rebuilds all of this.
  body.addEventListener('click', function (ev) {
      var pr = ev.target.closest('.print');
      if (pr) {
        printTicket(pr.getAttribute('data-code'));
        return;
      }
      var btn = ev.target.closest('.copy');
      if (!btn) return;
      var done = function () {
        btn.textContent = t('common.copied');
        setTimeout(function () { btn.textContent = t('common.copy'); }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(btn.dataset.code)
          .then(done, function () { btn.textContent = t('common.copyManual'); });
      } else {
        btn.textContent = t('common.copyManual');
      }
  });
})();
</script>
</body>
</html>
